spring:
  datasource:
    url: jdbc:h2:mem:eyota_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

eyota:
  timezone: Asia/Singapore
  cors:
    allowed-origins: http://localhost:4200
  security:
    jwt-secret: test_jwt_secret_key_at_least_32_chars_long
    jwt-expiration-minutes: 60
    bootstrap-admin-email:
    bootstrap-admin-password:
  attendance:
    gps-mandatory-default: true
    max-accuracy-metres: 50
    location-timeout-ms: 15000
    default-geofence-radius-metres: 150
  enrollment:
    otp-ttl-minutes: 30
    expose-otp-in-api: true
    activate-base-url: http://localhost:4200/activate
