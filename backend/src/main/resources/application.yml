spring:
  application:
    name: workright-hr
  # Local default so DevDataSeeder creates demo logins. Override with SPRING_PROFILES_ACTIVE=prod when deploying.
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eyota_hr}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Singapore
    use-jackson2-defaults: true
  # Loaded from backend/.env via DotEnvEnvironmentPostProcessor (or OS env / start-dev.ps1)
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eyota:
  timezone: Asia/Singapore
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  security:
    jwt-secret: ${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  attendance:
    gps-mandatory-default: true
    # Browser GPS indoors is often 80-150 m; 50 m blocked legitimate office clock-ins.
    max-accuracy-metres: ${GPS_MAX_ACCURACY_METRES:150}
    location-timeout-ms: 20000
    default-geofence-radius-metres: 150
  onboarding:
    storage-dir: ${ONBOARDING_STORAGE_DIR:./data/onboarding-docs}
    # Singapore MOM checklist / gate v2 (default OFF in prod)
    sg-flow-v2: ${ONBOARDING_SG_FLOW_V2:false}
    whatsapp:
      # mock = log to outbox only; live = requires WHATSAPP_* env (still falls back to outbox until wired)
      mode: ${WHATSAPP_MODE:mock}
      template-confirm-link: ${WHATSAPP_TEMPLATE_ONBOARDING_LINK:onboarding_confirm_link}
      token: ${WHATSAPP_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  enrollment:
    otp-ttl-minutes: ${ENROLLMENT_OTP_TTL_MINUTES:2}
    # Authoritative OTP window (defaults to 2 minutes)
    otp-ttl-seconds: ${ENROLLMENT_OTP_TTL_SECONDS:120}
    invitation-ttl-hours: ${ENROLLMENT_INVITATION_TTL_HOURS:72}
    otp-resend-cooldown-seconds: ${ENROLLMENT_OTP_RESEND_COOLDOWN_SECONDS:30}
    otp-max-attempts: ${ENROLLMENT_OTP_MAX_ATTEMPTS:5}
    # Never expose OTP in API responses in production
    expose-otp-in-api: ${ENROLLMENT_EXPOSE_OTP:false}
    activate-base-url: ${ACTIVATE_BASE_URL:http://localhost:4200/activate-account}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@eyota.sg}
    from-name: ${MAIL_FROM_NAME:Eyota Workright HR}

logging:
  level:
    sg.eyota.workright: INFO
