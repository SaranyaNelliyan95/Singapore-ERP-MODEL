spring:
  application:
    name: workright-hr
  # Local default so DevDataSeeder creates demo logins. Override with SPRING_PROFILES_ACTIVE=prod when deploying.
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eyota_hr}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres2204}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Singapore
    use-jackson2-defaults: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eyota:
  timezone: Asia/Singapore
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  security:
    jwt-secret: ${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  attendance:
    gps-mandatory-default: true
    max-accuracy-metres: ${GPS_MAX_ACCURACY_METRES:50}
    location-timeout-ms: 15000
    default-geofence-radius-metres: 150
  enrollment:
    otp-ttl-minutes: ${ENROLLMENT_OTP_TTL_MINUTES:30}
    # true for local/dev so HR/Postman can see OTP without real SMTP
    expose-otp-in-api: ${ENROLLMENT_EXPOSE_OTP:true}
    activate-base-url: ${ACTIVATE_BASE_URL:http://localhost:4200/activate}

logging:
  level:
    sg.eyota.workright: INFO
