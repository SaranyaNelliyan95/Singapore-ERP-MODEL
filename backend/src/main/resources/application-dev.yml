# Local development — activate with SPRING_PROFILES_ACTIVE=dev
spring:
  config:
    activate:
      on-profile: dev

eyota:
  onboarding:
    # Enable SG flow locally so HR can exercise the new checklist; override with ONBOARDING_SG_FLOW_V2=false
    sg-flow-v2: ${ONBOARDING_SG_FLOW_V2:true}
  enrollment:
    # Local only: allow HR UI to show OTP when SMTP is off
    expose-otp-in-api: ${ENROLLMENT_EXPOSE_OTP:true}
  # Dev default ON so IntelliJ/Maven still email when .env loads SMTP_*.
  # Override with MAIL_ENABLED=false in backend/.env if you want log-only mode.
  mail:
    enabled: ${MAIL_ENABLED:true}

logging:
  level:
    sg.eyota.workright: DEBUG
    org.springframework.security: INFO
